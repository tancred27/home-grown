  <text x="80" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#e8efe8">HomeGrown</text>
  <text x="82" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#e8efe8">Has someone in my company already built this?</text>
  <text x="82" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#9db0a2">Ask before you build. Find what other teams made, who made it,</text>
  <text x="82" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#9db0a2">and whether it is ready to use, even when you can't see their code.</text>
