  <path d="M880 262 Q1010 238 1140 262" stroke="#2a3a2f" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <g transform="translate(1010,118) scale(3.2)">
    <path d="M0 40 C0 25 0 15 0 4" stroke="#5cc27a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M0 18 C-4 4 -18 -2 -30 2 C-26 14 -14 22 0 18 Z" fill="#7fd894"/>
