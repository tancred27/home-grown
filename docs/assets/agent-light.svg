em, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#1f1c18">Its code is private to you, so I won&#x27;t write a new Kafka</text><text x="82" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#1f1c18">client yet. Shall I draft an access request to their lead?</text>
