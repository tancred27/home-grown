<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
  <rect width="1200" height="340" rx="24" fill="#f7f4ec"/>
  <g clip-path="url(#card)"><circle cx="1010" cy="170" r="210" fill="#e4efe2"/></g>
  <path d="M880 262 Q1010 238 1140 262" stroke="#d9d3c3" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <g transform="translate(1010,118) scale(3.2)">
    <path d="M0 40 C0 25 0 15 0 4" stroke="#2f7d46" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M0 18 C-4 4 -18 -2 -30 2 C-26 14 -14 22 0 18 Z" fill="#4caf63"/>
