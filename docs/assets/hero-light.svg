  <text x="80" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" fill="#1d2a20">HomeGrown</text>
  <text x="82" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#1d2a20">Has someone in my company already built this?</text>
  <text x="82" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#5b6b5f">Ask before you build. Find what other teams made, who made it,</text>
  <text x="82" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#5b6b5f">and whether it is ready to use, even when you can't see their code.</text>
