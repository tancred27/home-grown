  <rect x="580" y="40" width="560" height="80" rx="20" fill="#f4f0e9"/><text x="602" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#141210">Add Kafka produce and consume steps</text><text x="602" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#141210">to our k6 tests.</text><rect x="60" y="140" width="1080" height="150" rx="16" fill="none" stroke="#36322d" stroke-width="2" stroke-dasharray="7 6"/><text x="84" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="#b9b2a7">Agent calls find_existing</text><text x="84" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#f4f0e9">“Produce and consume Kafka messages from k6 load tests”</text><text x="84" y="236" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18"><tspan fill="#f4f0e9" font-weight="700">xk6-kafka</tspan><tspan fill="#ffb27a" font-weight="700">   beta</tspan><tspan fill="#b9b2a7">   team-xk6-kafka · use as-is</tspan></text><text x="84" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18"><tspan fill="#ff8c5c" font-weight="700">can_read_code: false</tspan><tspan fill="#b9b2a7">   ask Lead, team-xk6-kafka for access</tspan></text><rect x="60" y="310" width="640" height="108" rx="20" fill="#1c1a17"/><text x="82" y="346" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#f4f0e9">team-xk6-kafka already built this: xk6-kafka, in beta.</text><text x="82" y="374" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#f4f0e9">Its code is private to you, so I won&#x27;t write a new Kafka</text><text x="82" y="402" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="#f4f0e9">client yet. Shall I draft an access request to their lead?</text>
