<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
  <rect width="1200" height="430" rx="24" fill="#f7f4ec"/>
  <text x="80" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="2" fill="#5b6b5f">HOW IT WORKS</text>
  
  <rect x="80" y="70" width="320" height="300" rx="20" fill="#ffffff" stroke="#d9d3c3" stroke-width="2"/>
  <circle cx="144" cy="136" r="36" fill="#e4efe2"/>
  <g transform="translate(144,136)" stroke="#2f7d46" stroke-width="4" fill="none">
      <path d="M-20 0 Q0 -18 20 0 Q0 18 -20 0 Z"/><circle r="6" fill="#2f7d46"/></g>
  <text x="364" y="120" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#d9d3c3">1</text>
  <text x="120" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1d2a20">It watches</text>
  <text x="120" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5b6b5f">your company's code</text><text x="120" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5b6b5f">and docs, and notices</text><text x="120" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5b6b5f">what changes.</text>
  <path d="M414 208 l12 12 l-12 12" stroke="#2f7d46" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <rect x="440" y="70" width="320" height="300" rx="20" fill="#ffffff" stroke="#d9d3c3" stroke-width="2"/>
  <circle cx="504" cy="136" r="36" fill="#e4efe2"/>
  <g transform="translate(504,136)" stroke="#2f7d46" stroke-width="4" fill="none" stroke-linejoin="round">
      <path d="M-20 -14 L-2 -10 L-2 16 L-20 12 Z"/><path d="M20 -14 L2 -10 L2 16 L20 12 Z"/></g>
  <text x="724" y="120" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#d9d3c3">2</text>
  <text x="480" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1d2a20">It remembers</text>
  <text x="480" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5b6b5f">what each piece does,</text><text x="480" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5b6b5f">who built it, and</text><text x="480" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5b6b5f">whether it is live.</text>
  <path d="M774 208 l12 12 l-12 12" stroke="#2f7d46" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <rect x="800" y="70" width="320" height="300" rx="20" fill="#ffffff" stroke="#d9d3c3" stroke-width="2"/>
  <circle cx="864" cy="136" r="36" fill="#e4efe2"/>
  <g transform="translate(864,136)" stroke="#2f7d46" stroke-width="4" fill="none" stroke-linejoin="round">
      <path d="M-20 -14 H20 V8 H-4 L-14 18 V8 H-20 Z"/></g>
  <text x="1084" y="120" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#d9d3c3">3</text>
  <text x="840" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1d2a20">It answers</text>
  <text x="840" y="262" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5b6b5f">“Has anyone built X?”</text><text x="840" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5b6b5f">with the best matches,</text><text x="840" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#5b6b5f">and only what you may see.</text>
  <text x="600" y="408" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#5b6b5f">Two AI agents do the work. Permissions are enforced by the database itself.</text>
</svg>
