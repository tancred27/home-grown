<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
  <rect width="1200" height="470" rx="24" fill="#faf6f0" stroke="#e4dccf" stroke-width="2"/>
  <text x="80" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#57514a">How it works</text>
  <rect x="80" y="70" width="320" height="340" rx="20" fill="#ffffff" stroke="#e4dccf" stroke-width="2"/><rect x="112" y="102" width="48" height="48" rx="14" fill="#8fbcff"/><text x="136" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1410">1</text><text x="112" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#1f1c18">It notices changes</text><text x="112" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#57514a">A push or the poller says</text><text x="112" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#57514a">which repositories moved.</text><text x="112" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#57514a">It rereads only the folders</text><text x="112" y="319" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#57514a">that changed.</text><rect x="440" y="70" width="320" height="340" rx="20" fill="#ffffff" stroke="#e4dccf" stroke-width="2"/><rect x="472" y="102" width="48" height="48" rx="14" fill="#ffb27a"/><text x="496" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1410">2</text><text x="472" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#1f1c18">It writes down</text><text x="472" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#1f1c18">what each part does</text><text x="472" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#57514a">What it&#x27;s for, what its</text><text x="472" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#57514a">tests show, who built it</text><text x="472" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#57514a">and how ready it is, each</text><text x="472" y="349" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#57514a">linked to its source file.</text><rect x="800" y="70" width="320" height="340" rx="20" fill="#ffffff" stroke="#e4dccf" stroke-width="2"/><rect x="832" y="102" width="48" height="48" rx="14" fill="#f5e17a"/><text x="856" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#1a1410">3</text><text x="832" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#1f1c18">It answers,</text><text x="832" y="226" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#1f1c18">or says no</text><text x="832" y="268" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#57514a">It checks each likely match</text><text x="832" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#57514a">against your question, shows</text><text x="832" y="322" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#57514a">only what you may see, and</text><text x="832" y="349" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#57514a">says when nothing fits.</text>
  <text x="600" y="446" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="#57514a">Two agents share one database. The database itself decides who sees what.</text>
</svg>
