[project]
name = "homegrown"
version = "0.1.0"
description = "Answers 'has someone in my org already built this?', across private repos and team boundaries"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Viswa" }]
requires-python = ">=3.12"
keywords = ["langgraph", "agents", "code-search", "pgvector", "mcp", "developer-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "anthropic>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-anthropic>=1.0",     # chat model for the test coding agent
    "mcp>=2.0",                     # MCPServer (FastMCP was renamed in 2.x)
    # fastembed (onnxruntime) rather than sentence-transformers: same BGE models,
    # ~100MB install instead of pulling ~2.5GB of torch.
    "fastembed>=0.4",
    "numpy>=1.26",
    # The API only: spans and metrics are no-ops unless the [otel] extra is installed and
    # HOMEGROWN_OTEL_ENABLED is set (docs/observability.md).
    "opentelemetry-api>=1.27",
]

[project.urls]
Homepage = "https://github.com/tancred27/home-grown"
Issues = "https://github.com/tancred27/home-grown/issues"
Changelog = "https://github.com/tancred27/home-grown/blob/main/CHANGELOG.md"

[project.scripts]
homegrown = "homegrown.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.17.3"]
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "anthropic>=2.5",               # its open_telemetry option, to keep its own spans off
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homegrown"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
